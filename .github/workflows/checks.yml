name: CI

on:
  push:
  pull_request:

jobs:
  test-and-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q
      - run: python -m map_demo.cli examples/synthetic-map.json outputs/demo-map.xlsx --preview outputs/demo-preview.png
      - name: Check required files
        run: |
          test -f README.md
          test -f docs/case-study.md
          test -f docs/images/architecture.svg
      - name: Block private data formats
        run: |
          ! git ls-files | grep -E '\.(pdf|xlsx|xlsm|docx|sqlite|db)$|(^|/)\.env$'
