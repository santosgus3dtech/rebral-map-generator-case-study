<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Rebral map generator case study architecture</title>
  <desc id="desc">Sanitized architecture for a private document automation system with source files, SQLite normalization, PDF extraction, desktop app, local web app and generated spreadsheets.</desc>
  <rect width="1120" height="520" rx="18" fill="#f8fafc"/>
  <defs>
    <style>
      .box{fill:#fff;stroke:#cbd5e1;stroke-width:2}
      .data{fill:#f8f5ff;stroke:#7c3aed}
      .app{fill:#eff6ff;stroke:#2563eb}
      .safe{fill:#f0fdf4;stroke:#16a34a}
      .out{fill:#fff7ed;stroke:#ea580c}
      .t{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#111827}
      .h{font-size:22px;font-weight:850}
      .p{font-size:15px}
      .s{font-size:12px;fill:#475569}
      .arrow{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>
  <text x="42" y="48" class="t h">Rebral Map Generator Case Study</text>
  <text x="42" y="76" class="t s">Sanitized public overview of a private document automation system</text>

  <rect x="52" y="130" width="190" height="120" rx="12" class="box"/>
  <text x="88" y="172" class="t p">Operational inputs</text>
  <text x="88" y="198" class="t s">Excel templates</text>
  <text x="88" y="218" class="t s">PDF documents</text>
  <text x="88" y="238" class="t s">Unit metadata</text>

  <rect x="302" y="130" width="190" height="120" rx="12" class="box data"/>
  <text x="340" y="172" class="t p">SQLite model</text>
  <text x="340" y="198" class="t s">Normalized units</text>
  <text x="340" y="218" class="t s">Audit trail</text>
  <text x="340" y="238" class="t s">Header view</text>

  <rect x="552" y="100" width="210" height="150" rx="12" class="box app"/>
  <text x="596" y="148" class="t p">Python desktop app</text>
  <text x="596" y="174" class="t s">Forms and validation</text>
  <text x="596" y="194" class="t s">Draft autosave</text>
  <text x="596" y="214" class="t s">Excel generation</text>

  <rect x="552" y="305" width="210" height="130" rx="12" class="box app"/>
  <text x="602" y="350" class="t p">FastAPI local web</text>
  <text x="602" y="376" class="t s">Raspberry Pi deployment</text>
  <text x="602" y="396" class="t s">Internal network only</text>

  <rect x="822" y="130" width="220" height="120" rx="12" class="box out"/>
  <text x="862" y="172" class="t p">Generated workbooks</text>
  <text x="862" y="198" class="t s">Validated fields</text>
  <text x="862" y="218" class="t s">Preserved template</text>
  <text x="862" y="238" class="t s">Ready for review</text>

  <rect x="822" y="315" width="220" height="120" rx="12" class="box safe"/>
  <text x="872" y="358" class="t p">Public boundary</text>
  <text x="872" y="384" class="t s">No private data</text>
  <text x="872" y="404" class="t s">Case study only</text>

  <path d="M242 190 H302" class="arrow"/>
  <path d="M492 190 H552" class="arrow"/>
  <path d="M762 190 H822" class="arrow"/>
  <path d="M397 250 C420 345 500 370 552 370" class="arrow"/>
  <path d="M762 370 H822" class="arrow"/>
</svg>
